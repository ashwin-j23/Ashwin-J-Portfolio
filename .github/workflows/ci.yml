name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Links, alt text, CSP-safe markup, security.txt
        run: node scripts/check-site.mjs .
      - name: JavaScript syntax
        run: |
          node --check script.js
          node --check resume.js
      - name: JSON config
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: No secrets committed
        run: |
          if grep -rInE "(api[_-]?key|secret|token|password)\s*[:=]\s*['\"][A-Za-z0-9_\-]{16,}" --include='*.html' --include='*.js' --include='*.json' . ; then
            echo "::error::Possible secret found in the repository"; exit 1
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder (only public files)
        run: |
          mkdir -p _site
          cp -r index.html 404.html resume.html script.js resume.js style.css assets demos .well-known _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
