name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Links, alt text, CSP-safe markup, security.txt
        run: node scripts/check-site.mjs .
      - name: JavaScript syntax
        run: |
          node --check script.js
      - name: JSON config
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: No secrets committed
        run: |
          if grep -rInE "(api[_-]?key|secret|token|password)\s*[:=]\s*['\"][A-Za-z0-9_\-]{16,}" --include='*.html' --include='*.js' --include='*.json' . ; then
            echo "::error::Possible secret found in the repository"; exit 1
          fi
