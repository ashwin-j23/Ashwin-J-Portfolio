<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  
  <!-- Magnifying glass -->
  <g transform="translate(64, 64)" filter="url(#glow)">
    <!-- Handle -->
    <path d="M18 18 L32 32" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <!-- Lens circle -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="white" stroke-width="5" opacity="0.95"/>
    <!-- Reflection -->
    <path d="M-12 -12 Q-4 -4 0 0" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Scan lines -->
  <g transform="translate(64, 64)" opacity="0.3">
    <line x1="-18" y1="-26" x2="18" y2="-26" stroke="white" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line x1="-18" y1="26" x2="18" y2="26" stroke="white" stroke-width="1.5" stroke-dasharray="4,2"/>
  </g>
</svg>