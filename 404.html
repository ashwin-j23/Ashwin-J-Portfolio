<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Not found · Ashwin J</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #111; color: #ececea; font: 15px/1.7 "IBM Plex Mono", ui-monospace, monospace; }
    .term { width: min(640px, 100%); background: #0c0c0c; border: 1px solid #333; border-radius: 12px; overflow: hidden; }
    .bar { display: flex; gap: 7px; padding: 11px 14px; background: #1a1a1a; }
    .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
    pre { padding: 20px; white-space: pre-wrap; }
    .p { color: #6fae75; } .e { color: #d0644f; } .m { color: #9a9893; }
    a { color: #e8743b; }
    .cur { display: inline-block; width: 9px; background: #e8743b; animation: b 1s steps(1) infinite; }
    @keyframes b { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
  </style>
</head>
<body>
  <main class="term">
    <div class="bar"><i></i><i></i><i></i></div>
<pre><span class="p">ashwin@arch:~$</span> cd this-page
<span class="e">bash: cd: this-page: No such file or directory</span>
<span class="m"># 404 — the page you asked for doesn't exist.</span>

<span class="p">ashwin@arch:~$</span> <a href="/">cd ~/portfolio</a>  <span class="m"># go home</span>
<span class="p">ashwin@arch:~$</span> <span class="cur">&nbsp;</span></pre>
  </main>
</body>
</html>
