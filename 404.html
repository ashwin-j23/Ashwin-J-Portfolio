  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #d8dadd; color: #2b2d31; font: 15px/1.7 "DM Mono", ui-monospace, monospace; }
    .term { width: min(640px, 100%); background: #2b2d31; color: #f7f7f5; border: 1px solid #2b2d31; box-shadow: 0 24px 50px rgba(43, 45, 49, .22); border-radius: 12px; overflow: hidden; }
    .bar { display: flex; gap: 7px; padding: 11px 14px; background: #2b2d31; }
    .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff6b4a; } .bar i:nth-child(2) { background: #ff6b4a; } .bar i:nth-child(3) { background: #d8dadd; }
    pre { padding: 20px; white-space: pre-wrap; }
    .p { color: #d8dadd; } .e { color: #ff6b4a; } .m { color: #d8dadd; }
    a { color: #ff6b4a; }
    .cur { display: inline-block; width: 9px; background: #ff6b4a; animation: b 1s steps(1) infinite; }
    @keyframes b { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
  </style>
</head>
<body>
  <main class="term">

<span class="p">ashwin@arch:~$</span> <span class="cur">&nbsp;</span></pre>
  </main>
